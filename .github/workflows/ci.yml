name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build python3
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset strict
      - name: Build
        run: cmake --build --preset strict --parallel 2
      - name: Test
        run: ctest --preset strict --parallel 2

  windows:
    name: Windows / MSVC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset strict
      - name: Build
        run: cmake --build --preset strict --parallel 2
      - name: Test
        run: ctest --preset strict --parallel 2
