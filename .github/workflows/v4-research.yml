name: V4 Research VM

on:
  push:
    paths:
      - "research/v4m3/**"
      - "research/v4m4/**"
      - "research/v4m5/**"
      - "research/v4m6/**"
      - "research/v4m7/**"
      - "src/package/hash.cpp"
      - "src/package/hash.hpp"
      - ".github/workflows/v4-research.yml"
  pull_request:
    paths:
      - "research/v4m3/**"
      - "research/v4m4/**"
      - "research/v4m5/**"
      - "research/v4m6/**"
      - "research/v4m7/**"
      - "src/package/hash.cpp"
      - "src/package/hash.hpp"
      - ".github/workflows/v4-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux-Clang
          - os: windows-2025
            name: Windows-MSVC
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S research/v4m3 -B build/v4m3 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/v4m3 --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/v4m3 -C Release --output-on-failure
      - name: Configure V4-M4
        run: cmake -S research/v4m4 -B build/v4m4 -DCMAKE_BUILD_TYPE=Release
      - name: Build V4-M4
        run: cmake --build build/v4m4 --config Release --parallel 2
      - name: Test V4-M4
        run: ctest --test-dir build/v4m4 -C Release --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure V4-M5
        run: cmake -S research/v4m5 -B build/v4m5 -DCMAKE_BUILD_TYPE=Release
      - name: Build V4-M5
        run: cmake --build build/v4m5 --config Release --parallel 2
      - name: Test V4-M5
        run: ctest --test-dir build/v4m5 -C Release --output-on-failure
      - name: Configure V4-M6
        run: cmake -S research/v4m6 -B build/v4m6 -DCMAKE_BUILD_TYPE=Release
      - name: Build V4-M6
        run: cmake --build build/v4m6 --config Release --parallel 2
      - name: Test V4-M6
        run: ctest --test-dir build/v4m6 -C Release --output-on-failure
      - name: Configure V4-M7
        run: cmake -S research/v4m7 -B build/v4m7 -DCMAKE_BUILD_TYPE=Release
      - name: Build V4-M7
        run: cmake --build build/v4m7 --config Release --parallel 2
      - name: Test V4-M7
        run: ctest --test-dir build/v4m7 -C Release --output-on-failure
      - name: Node.js differential V4-M5
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE="build/v4m5/Release/venom_v4m5_js.exe"
          else
            EXE="build/v4m5/venom_v4m5_js"
          fi
          python research/v4m5/node_differential.py "$EXE"
