version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /examples/react-vite-showcase
    schedule:
      interval: monthly
    labels: [dependencies, javascript]
    open-pull-requests-limit: 5
